# Netlify detecta Next.js y usa su adaptador oficial (páginas, imágenes optimizadas y redirecciones).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Adaptador oficial de Next.js para Netlify. Se declara explícitamente para no depender de la
# detección automática: sin él, Netlify publica la carpeta .next como archivos sueltos y todo da 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
